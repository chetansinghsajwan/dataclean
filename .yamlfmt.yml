# yaml-language-server: $schema=https://www.schemastore.org/yamlfmt.json
line_ending: lf
exclude:
    - external/
gitignore_excludes: true
formatter:
    type: basic
    indent: 4
    trim_trailing_whitespace: true
    eof_newline: true
    force_array_style: block
    force_quote_style: double
    max_line_length: 100
    retain_line_breaks_single: true
