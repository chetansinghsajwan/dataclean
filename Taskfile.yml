# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'

tasks:
  # =========================================================================
  # Setup tasks
  # =========================================================================

  setup:
    desc: Setup project config and dependencies
    cmds:
      - unset JAVA_HOME
      - cmd: git config --local --unset include.path
        if: '[ "$CI" != "true" ]'
      - cmd: git config --local include.path ../.gitconfig
        if: '[ "$CI" != "true" ]'
      - cmd: rm -rf .git/hooks && lefthook install
        if: '[ "$CI" != "true" ]'
      - cmd: uv sync
        if: '[ "$CI" != "true" ]'
      - cmd: uv sync --frozen
        if: '[ "$CI" = "true" ]'

  # =========================================================================
  # Build and deploy tasks
  # =========================================================================

  build:
    desc: Build everything
    cmds:
      - task: build:src

  build:src:
    desc: Build the source code
    cmds:
      - uv build --no-create-gitignore --clear --out-dir build/src

  deploy:docs:
    desc: "Build the docs"
    cmds:
      - git fetch origin gh-pages --depth=1 || true
      - uv run mike deploy {{.VERSION}} latest --update-aliases --push

  serve:docs:
    desc: "Build and serve the docs on localhost"
    cmds:
      - uv run mike serve

  # =========================================================================
  # Cleaning tasks
  # =========================================================================

  clean:
    desc: Clean the project
    cmds:
      - task: clean:env
      - task: clean:src
      - task: clean:cache
      - task: clean:docs

  clean:env:
    desc: Clean the env
    cmds:
      - rm -rf .venv
      - rm -rf .devbox

  clean:src:
    desc: Clean the source build
    cmds:
      - rm -rf build/src

  clean:cache:
    desc: Clean the cache
    cmds:
      - rm -rf .cache .pytest_cache .ruff_cache .rumdl_cache
      - find . -type d -name "__pycache__" -exec rm -rf {} +

  clean:docs:
    desc: Clean the docs
    cmds:
      - rm -rf build/docs site

  clean:logs:
    desc: Clean the logs
    cmds:
      - rm -rf .logs *.log **/*.log

  # =========================================================================
  # Format, check and fix
  # =========================================================================
  fmt:
    desc: Format all file sets across the project
    deps:
      - fmt:toml
      - fmt:md
      - fmt:sh
      - fmt:json
      - fmt:py
      - fmt:nix

  check:
    desc: Lint all file sets across the project
    deps:
      - lint:toml
      - lint:md
      - lint:sh
      - lint:json
      - lint:py
      - lint:nix
      - check:gha

  fix:
    desc: Lint and auto-fix all file sets across the project — safe fixes only
    deps:
      - lint-fix:toml
      - lint-fix:md
      - lint-fix:sh
      - lint-fix:json
      - lint-fix:py
      - lint-fix:nix

  fix:unsafe:
    desc: Lint and auto-fix all file sets across the project, including unsafe fixes
    deps:
      - lint-fix:toml
      - lint-fix:md
      - lint-fix:sh
      - lint-fix:json
      - lint-fix:py:unsafe
      - lint-fix:nix

  # =========================================================================
  # TOML (taplo)
  # =========================================================================
  # taplo has no built-in recursive/gitignore-aware file discovery, so we use
  # git ls-files by default. Pass explicit paths via -- to target specific
  # files instead (e.g. from pre-commit) and skip the git discovery step.

  _toml:
    internal: true
    cmds:
      - |
        if [ -n "{{.FILES}}" ]; then
          taplo {{.CMD}} {{.FILES}}
        else
          git ls-files -z -o -c --exclude-standard -- '*.toml' | xargs -0 --no-run-if-empty taplo {{.CMD}}
        fi

  fmt:toml:
    desc: Format TOML files using taplo (pass paths as args; defaults to all tracked/untracked files)
    cmds:
      - task: _toml
        vars:
          CMD: fmt
          FILES: '{{.CLI_ARGS}}'

  lint:toml:
    desc: Lint TOML files using taplo (pass paths as args; defaults to all tracked/untracked files)
    cmds:
      - task: _toml
        vars:
          CMD: check
          FILES: '{{.CLI_ARGS}}'

  lint-fix:toml:
    desc: Lint and auto-fix TOML files using taplo (pass paths as args; defaults to all tracked/untracked files)
    cmds:
      - task: _toml
        vars:
          CMD: fmt
          FILES: '{{.CLI_ARGS}}'

  # =========================================================================
  # Markdown (rumdl)
  # =========================================================================
  fmt:md:
    desc: Format Markdown files using rumdl (pass paths as args; defaults to all files)
    cmds:
      - rumdl fmt {{.CLI_ARGS | default "."}}

  lint:md:
    desc: Lint Markdown files using rumdl (pass paths as args; defaults to all files)
    cmds:
      - rumdl check {{.CLI_ARGS | default "."}}

  lint-fix:md:
    desc: Lint and auto-fix Markdown files using rumdl (pass paths as args; defaults to all files)
    cmds:
      - rumdl check --fix {{.CLI_ARGS | default "."}}

  # =========================================================================
  # Shell / Bash (shuck)
  # =========================================================================
  fmt:sh:
    desc: Format Shell scripts using shuck (pass paths as args; defaults to all files)
    cmds:
      - shuck format {{.CLI_ARGS | default "."}}

  lint:sh:
    desc: Lint Shell scripts using shuck (pass paths as args; defaults to all files)
    cmds:
      - shuck check {{.CLI_ARGS | default "."}}

  lint-fix:sh:
    desc: Lint and auto-fix Shell scripts using shuck (pass paths as args; defaults to all files)
    cmds:
      - shuck check --fix {{.CLI_ARGS | default "."}}

  # =========================================================================
  # JSON / JSONC (biome)
  # =========================================================================
  fmt:json:
    desc: Format JSON and JSONC files using biome (pass paths as args; defaults to all files)
    cmds:
      - biome format --write {{.CLI_ARGS | default "."}}

  lint:json:
    desc: Lint JSON and JSONC files using biome (pass paths as args; defaults to all files)
    cmds:
      - biome lint {{.CLI_ARGS | default "."}}

  lint-fix:json:
    desc: Lint and auto-fix JSON and JSONC files using biome (pass paths as args; defaults to all files)
    cmds:
      - biome check --write {{.CLI_ARGS | default "."}}

  # =========================================================================
  # Python & Jupyter Notebooks (ruff)
  # =========================================================================
  fmt:py:
    desc: Format .py, .pyi and .ipynb files using ruff (pass paths as args; defaults to all files)
    cmds:
      - ruff format {{.CLI_ARGS | default "."}}

  lint:py:
    desc: Lint .py, .pyi and .ipynb files using ruff (pass paths as args; defaults to all files)
    cmds:
      - ruff check {{.CLI_ARGS | default "."}}

  lint-fix:py:
    desc: Lint and auto-fix .py, .pyi and .ipynb files using ruff — safe fixes only (pass paths as args; defaults to all files)
    cmds:
      - ruff check --fix {{.CLI_ARGS | default "."}}

  lint-fix:py:unsafe:
    desc: Lint and auto-fix .py, .pyi and .ipynb files using ruff, including unsafe fixes (pass paths as args; defaults to all files)
    prompt: This applies unsafe fixes that may change behavior — continue?
    cmds:
      - ruff check --fix --unsafe-fixes {{.CLI_ARGS | default "."}}

  # =========================================================================
  # Nix (nixfmt, statix, deadnix)
  # =========================================================================

  fmt:nix:
    desc: Format .nix files using nixfmt (pass paths as args; defaults to all files)
    cmds:
      - nixfmt {{.CLI_ARGS | default "."}}

  lint:nix:
    desc: Lint .nix files using statix and deadnix (pass paths as args; defaults to all files)
    cmds:
      - statix check {{.CLI_ARGS | default "."}}
      - deadnix {{.CLI_ARGS | default "."}}

  lint-fix:nix:
    desc: Lint and auto-fix .nix files using statix and deadnix (pass paths as args; defaults to all files)
    cmds:
      - statix fix {{.CLI_ARGS | default "."}}
      - deadnix --edit {{.CLI_ARGS | default "."}}

  # =========================================================================
  # Github Actions (zizmor)
  # =========================================================================
  check:gha:
    desc: Check GitHub Actions workflows for security issues using zizmor (pass paths as args; defaults to .github/workflows/)
    cmds:
      - zizmor {{.CLI_ARGS | default ".github/workflows/"}}

  # =========================================================================
  # Security
  # =========================================================================
  scan:
    desc: Run vulnerability scanner
    cmds:
      - |
        EXIT_CODE=0

        # Fail with exit code 1 in CI mode
        [ "$TF_BUILD" = "True" ] && EXIT_CODE=1

        trivy fs --scanners vuln,secret,misconfig,license --severity HIGH,CRITICAL --exit-code $EXIT_CODE .

  # =========================================================================
  # Tests
  # =========================================================================

  test:cicd:
    desc: Run CI/CD checks
    cmds:
      - task: test:cicd:release
      - task: test:cicd:tests

  test:cicd:release:
    desc: Run CI/CD checks for release
    cmds:
      - act --workflows ./.github/workflows/release.yml

  test:cicd:tests:
    desc: Run CI/CD checks for tests
    cmds:
      - act --workflows ./.github/workflows/tests.yml

  test:cicd:push-release-tag:
    desc: Run CI/CD checks for pushing
    cmds:
      - act push --env GITHUB_REF=refs/tags/v1.0.0

  test:
    desc: Run the test suite
    cmds:
      - uv run pytest tests/

  test:cleaners:
    desc: Run tests for the cleaners
    cmds:
      - uv run pytest tests/cleaners/

  test:engines:
    desc: Run tests for the engines
    cmds:
      - uv run pytest tests/engine/

  test:phone:
    desc: Run tests for the phone cleaner
    cmds:
      - uv run pytest tests/cleaners/test_phone_cleaner.py

  test:email:
    desc: Run tests for the email cleaner
    cmds:
      - uv run pytest tests/cleaners/test_email_cleaner.py

  test:bool:
    desc: Run tests for the bool cleaner
    cmds:
      - uv run pytest tests/cleaners/test_bool_cleaner.py

  test:gender:
    desc: Run tests for the gender cleaner
    cmds:
      - uv run pytest tests/cleaners/test_gender_cleaner.py

  test:num:
    desc: Run tests for the num cleaner
    cmds:
      - uv run pytest tests/cleaners/test_num_cleaner.py

  test:text:
    desc: Run tests for the text cleaner
    cmds:
      - uv run pytest tests/cleaners/test_text_cleaner.py

  test:datetime:
    desc: Run tests for the datetime cleaner
    cmds:
      - uv run pytest tests/cleaners/test_datetime_cleaner.py

  test:country:
    desc: Run tests for the country cleaner
    cmds:
      - uv run pytest tests/cleaners/test_country_cleaner.py

  test:uuid:
    desc: Run tests for the uuid cleaner
    cmds:
      - uv run pytest tests/cleaners/test_uuid_cleaner.py

  test:pandas:
    desc: Run tests for the pandas engine
    cmds:
      - uv run pytest tests/engine/test_pandas.py

  test:pyspark:
    desc: Run tests for the pyspark engine
    cmds:
      - uv run pytest tests/engine/test_pyspark.py
