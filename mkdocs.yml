site_name: "Dataclean"
site_dir: "build/docs"
docs_dir: "docs"

theme:
    name: readthedocs
    highlightjs: true
    fail_on_warning: false

markdown_extensions:
    - admonition
    - tables

extra:
    version:
        provider: mike
        default: latest

nav:
    - Home: index.md
    - Getting Started: getting-started.md
    - Concepts: concepts.md
    - Cleaners:
        - Built-in Cleaners: cleaners.md
        - Writing a Custom Cleaner: custom-cleaners.md
    - Engines, Catalogs & Plugins: plugins.md
    - Configuration: configuration.md
    - Roadmap: rust-migrate-plan.md

plugins:
    - search
    - mkdocstrings:
        handlers:
            python:
                paths:
                    - src
                options:
                    show_source: true
                    show_root_heading: true
                    show_category_heading: true
                    inherited_members: true
                    docstring_style: google

    - mkdocs-autoapi:
        autoapi_dir: src
