[project]
name = "dataclean"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.13"
dependencies = [
    "pycountry>=26.2.16",
    "wordninja>=2.0.0",
    "phonenumbers>=9.0.34",
    "beartype>=0.22.9",
]

[project.optional-dependencies]
test-contracts = ["pytest>=9.0.3"]

[dependency-groups]
dev = [
    "mike>=2.2.0",
    "mkdocs>=1.5.0,<2.0.0",
    "mkdocs-autoapi>=0.4.1",
    "mkdocstrings[python]>=0.24.0",
    "pytest>=9.0.3",
    "dataclean-databricks",
    "dataclean-pandas",
    "dataclean-cch-crm",
]

[tool.uv.sources]
dataclean-databricks = { path = "plugins/dataclean-databricks", editable = true }
dataclean-pandas = { path = "plugins/dataclean-pandas", editable = true }
dataclean-cch-crm = { path = "plugins/dataclean-cch-crm", editable = true }

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"
